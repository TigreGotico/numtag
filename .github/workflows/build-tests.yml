name: Build Tests

on:
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

jobs:
  build:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@dev
    with:
      python_versions: '["3.11", "3.12", "3.13", "3.14"]'
      install_extras: 'test'
      test_path: 'tests'
  docs_check:
    uses: OpenVoiceOS/gh-automations/.github/workflows/docs-check.yml@dev
    with:
      docs_standard: true
      hf_space: TigreGotico/numtag
    secrets: inherit
